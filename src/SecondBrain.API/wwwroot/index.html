<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SecondBrain</title>
<style>
  /* Paleta inspirada em X/Discord: neutra, sem gradiente, sem sombra colorida.
     Bordas finas separam blocos em vez de box-shadow. Um único accent (azul). */
  :root {
    --bg: #ffffff;
    --sidebar: #f7f9f9;
    --surface: #ffffff;
    --hover: rgba(15,20,25,0.06);
    --text: #0f1419;
    --muted: #536471;
    --border: #eff3f4;
    --accent: #1d9bf0;
    --accent-text: #ffffff;
    --danger: #f4212e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --sidebar: #000000;
      --surface: #000000;
      --hover: rgba(239,243,244,0.08);
      --text: #e7e9ea;
      --muted: #71767b;
      --border: #2f3336;
      --accent: #1d9bf0;
      --accent-text: #ffffff;
      --danger: #f4212e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --sidebar: #000000;
    --surface: #000000;
    --hover: rgba(239,243,244,0.08);
    --text: #e7e9ea;
    --muted: #71767b;
    --border: #2f3336;
    --accent: #1d9bf0;
    --accent-text: #ffffff;
    --danger: #f4212e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button, input, textarea { font-family: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .app { display: flex; min-height: 100vh; max-width: 1200px; margin: 0 auto; }

  /* ---------- rail (abas laterais por linguagem/tag, estilo Discord) ---------- */
  .rail {
    width: 68px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--sidebar);
    padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto;
  }
  .rail-item {
    width: 46px; height: 46px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; background: var(--surface);
    border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border) inset; color: var(--muted);
    padding: 9px; transition: border-color .12s ease;
  }
  .rail-item img { width: 100%; height: 100%; object-fit: contain; }
  .rail-item:hover { border-color: var(--muted); }
  .rail-item.active { border-color: var(--accent); }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 280px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--sidebar); padding: 16px 12px; display: flex; flex-direction: column; gap: 12px;
  }
  .sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 4px; }
  .brand { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .stats { font-size: 12px; color: var(--muted); padding: 0 4px 8px; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px; border: none; background: transparent;
    color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 18px; height: 18px; }

  .search-pill {
    display: flex; align-items: center; gap: 8px; background: var(--sidebar);
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px;
  }
  .search-pill svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .search-pill input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; }
  .search-pill:focus-within { border-color: var(--accent); }

  .btn-pill {
    border: none; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-pill.btn-primary { background: var(--accent); color: var(--accent-text); }
  .btn-pill.btn-primary:hover { filter: brightness(0.92); }
  .btn-pill svg { width: 16px; height: 16px; }

  .nav-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; margin-top: 4px; }
  .nav-item {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--hover); font-weight: 700; }
  .nav-empty { color: var(--muted); font-size: 13px; padding: 10px; }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; border-right: 1px solid var(--border); }
  .main-header {
    position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; gap: 14px; z-index: 1;
  }
  .main-header h1 { font-size: 19px; margin: 0; font-weight: 800; }
  .main-body { padding: 4px 0; }

  .row {
    display: block; padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .row:hover { background: var(--hover); }
  .row .row-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .row .row-desc {
    margin: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .row .row-type {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px;
  }

  .empty-state { padding: 60px 24px; text-align: center; color: var(--muted); }
  .empty-state h2 { color: var(--text); font-size: 17px; margin-bottom: 6px; }

  /* ---------- detail view ---------- */
  .detail { padding: 20px; }
  .detail h1 { font-size: 22px; margin: 0 0 8px; }
  .detail .desc { color: var(--muted); font-size: 15px; margin: 0 0 12px; white-space: pre-wrap; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tag-pill {
    font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 10px;
  }

  .section { margin-top: 24px; }
  .section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 10px; }
  .item {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  }
  .item .t { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .item .d { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .item.relation-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .item.relation-item .d { margin: 0; }
  .item-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .item-remove:hover { color: var(--danger); }
  .code-block {
    display: block; background: var(--hover); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto; white-space: pre;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
    color: var(--text); line-height: 1.5;
  }
  .item-empty { color: var(--muted); font-size: 13px; }

  .quick-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .quick-add input { flex: 1; min-width: 140px; }
  .field {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    font-size: 14px; outline: none;
  }
  .field:focus { border-color: var(--accent); }

  .btn {
    border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 700;
  }
  .btn:hover { background: var(--hover); }
  .btn-danger { color: var(--danger); border-color: var(--border); }

  .detail-footer { display: flex; justify-content: flex-end; margin-top: 28px; }

  .msg { font-size: 13px; margin-top: 8px; }
  .msg.error { color: var(--danger); }

  /* ---------- modal (criar novo) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(91,112,131,.4); display: flex; align-items: flex-start;
    justify-content: center; padding: 8vh 16px; overflow-y: auto; z-index: 10;
  }
  .modal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    max-width: 500px; width: 100%;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .modal h2 { font-size: 18px; margin: 0; }
  .modal label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; }
  .modal input[type=text], .modal textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px; outline: none;
  }
  .modal input[type=text]:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 90px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .rail { width: auto; flex-direction: row; border-right: none; border-bottom: 1px solid var(--border); padding: 10px 12px; }
    .sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav-list { max-height: 160px; }
    .main { border-right: none; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail"></nav>

  <aside class="sidebar">
    <div class="sidebar-top">
      <span class="brand">SecondBrain</span>
      <button class="icon-btn" id="themeToggle" title="Alternar tema"></button>
    </div>
    <div class="stats" id="statsLine"></div>
    <div class="search-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="Buscar" oninput="onSearchInput()" />
    </div>
    <button class="btn-pill btn-primary" onclick="openNewConceptModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Novo verbete
    </button>
    <nav class="nav-list" id="navList"></nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
const ICONS = {
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
  sun: '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>',
  back: '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  close: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
};
function svg(name, size) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${size || 18}px;height:${size || 18}px">${ICONS[name]}</svg>`;
}

const state = { concepts: [], tags: [], activeTagId: null, view: { type: 'feed' }, allConceptsCache: null };

const RELATION_LABELS = { RelatedTo: 'Relacionado a', AlternativeTo: 'Alternativa a' };

async function ensureAllConceptsCache() {
  if (!state.allConceptsCache) state.allConceptsCache = await api('/api/concepts');
  return state.allConceptsCache;
}

// Logo oficial (colorido) de cada linguagem via devicon, num círculo neutro —
// nada de bandeira colorida no fundo (isso seria "enfeite"), só o logo real.
// Tag sem logo conhecido cai no fallback: as 2 primeiras letras do nome.
const TAG_LOGOS = {
  go: 'go/go-original.svg',
  csharp: 'csharp/csharp-original.svg',
  cpp: 'cplusplus/cplusplus-original.svg',
  python: 'python/python-original.svg',
  java: 'java/java-original.svg',
  javascript: 'javascript/javascript-original.svg',
};
const DEVICON_BASE = 'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/';
function tagLabel(name) { return name.slice(0, 2).toUpperCase(); }

async function loadTags() {
  state.tags = await api('/api/tags');
  renderRail();
}

function railItemContent(name) {
  const logoPath = TAG_LOGOS[name.toLowerCase()];
  if (!logoPath) return escapeHtml(tagLabel(name));
  const fallback = escapeHtml(tagLabel(name));
  return `<img src="${DEVICON_BASE}${logoPath}" alt="${escapeHtml(name)}" loading="lazy"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${fallback}'}))" />`;
}

function renderRail() {
  const rail = document.getElementById('rail');
  const allActive = state.activeTagId === null;
  const items = [`<div class="rail-item${allActive ? ' active' : ''}" title="Todos" onclick="selectTag(null)">Tudo</div>`];
  items.push(...state.tags.map(t => `<div class="rail-item${state.activeTagId === t.id ? ' active' : ''}" title="${escapeHtml(t.name)}" onclick="selectTag('${t.id}')">${railItemContent(t.name)}</div>`));
  rail.innerHTML = items.join('');
}

async function selectTag(tagId) {
  state.activeTagId = tagId;
  renderRail();
  await loadAllConcepts();
  renderFeed();
}

function applyThemeIcon() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeToggle').innerHTML = svg(isDark ? 'sun' : 'moon');
}
function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('secondbrain-theme', next); } catch (e) {}
  applyThemeIcon();
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('secondbrain-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  applyThemeIcon();
})();

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}));
  if (!res.ok) {
    let title = 'Algo deu errado.';
    try { const body = await res.json(); title = body.title || title; } catch (e) {}
    const err = new Error(title);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  return res.json();
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Render bem simples de Markdown (sem lib): bloco de código ```lang ... ```
// vira <pre>, e **negrito** vira <strong>. O resto é texto puro (a formatação
// de parágrafo já vem do white-space:pre-wrap no CSS). Tudo escapado antes.
function renderNoteContent(content) {
  const segments = (content || '').split(/```[a-z]*\n([\s\S]*?)```/g);
  return segments.map((seg, i) => {
    if (i % 2 === 1) return `<pre class="code-block">${escapeHtml(seg.trim())}</pre>`;
    return escapeHtml(seg)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }).join('');
}

async function loadAllConcepts() {
  const url = state.activeTagId ? `/api/concepts?tagId=${state.activeTagId}` : '/api/concepts';
  state.concepts = await api(url);
  renderNav(state.concepts);
  if (state.view.type === 'feed' || state.view.type === 'search') renderFeed();
}

function activeTagName() {
  if (!state.activeTagId) return null;
  const tag = state.tags.find(t => t.id === state.activeTagId);
  return tag ? tag.name : null;
}

function renderNav(concepts) {
  const nav = document.getElementById('navList');
  if (!concepts.length) {
    nav.innerHTML = '<div class="nav-empty">Nada guardado ainda.</div>';
    return;
  }
  nav.innerHTML = concepts.map(c => `
    <div class="nav-item${state.view.type === 'detail' && state.view.id === c.id ? ' active' : ''}" onclick="openConceptDetail('${c.id}')">${escapeHtml(c.name)}</div>
  `).join('');
}

// Troca o conteúdo principal e sempre volta o scroll pro topo — sem isso, ao
// sair de uma lista longa (scroll bem descido) pra um verbete curto, a página
// ficava "em branco" porque continuava rolada além do conteúdo novo.
function setMainContent(html) {
  const main = document.getElementById('main');
  main.innerHTML = html;
  window.scrollTo(0, 0);
  main.scrollTop = 0;
}

function renderFeed() {
  state.view = { type: 'feed' };
  document.getElementById('searchInput').value = '';
  renderNav(state.concepts);
  const tagName = activeTagName();
  const title = tagName ? `Verbetes · ${tagName}` : 'Seus verbetes';
  if (!state.concepts.length) {
    setMainContent(`
      <div class="main-header"><h1>${escapeHtml(title)}</h1></div>
      <div class="empty-state">
        <h2>Nada por aqui ainda</h2>
        <p>${tagName ? 'Nenhum verbete guardado com essa tag ainda.' : 'Clique em "Novo verbete" pra guardar a primeira coisa que você aprendeu.'}</p>
      </div>
    `);
    return;
  }
  setMainContent(`
    <div class="main-header"><h1>${escapeHtml(title)}</h1></div>
    <div class="main-body">
      ${state.concepts.map(c => `
        <div class="row" onclick="openConceptDetail('${c.id}')">
          <div class="row-title">${escapeHtml(c.name)}</div>
          <p class="row-desc">${escapeHtml(c.description || 'Sem descrição ainda.')}</p>
        </div>
      `).join('')}
    </div>
  `);
}

let searchTimer = null;
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { renderFeed(); return; }
  searchTimer = setTimeout(() => runSearch(q), 250);
}

async function runSearch(q) {
  state.view = { type: 'search', q };
  const data = await api('/api/search?q=' + encodeURIComponent(q));
  const typeLabel = { concept: 'Verbete', note: 'Anotação', project: 'Projeto' };
  if (!data.results.length) {
    setMainContent(`
      <div class="main-header"><h1>Busca</h1></div>
      <div class="empty-state">
        <h2>Nada encontrado para "${escapeHtml(q)}"</h2>
        <p>Talvez você ainda não tenha guardado isso — <a href="#" onclick="openNewConceptModal('${escapeHtml(q)}');return false;">criar um verbete</a> com esse nome?</p>
      </div>
    `);
    return;
  }
  setMainContent(`
    <div class="main-header"><h1>Busca: "${escapeHtml(q)}"</h1></div>
    <div class="main-body">
      ${data.results.map(r => `
        <div class="row" onclick="${r.type === 'concept' ? `openConceptDetail('${r.id}')` : ''}" style="${r.type !== 'concept' ? 'cursor:default' : ''}">
          <span class="row-type">${typeLabel[r.type] || r.type}</span>
          <div class="row-title">${escapeHtml(r.title)}</div>
        </div>
      `).join('')}
    </div>
  `);
}

function modalShell(innerHtml) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div></div>
          <button class="icon-btn" onclick="closeModal()">${svg('close', 16)}</button>
        </div>
        ${innerHtml}
      </div>
    </div>
  `;
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

function openNewConceptModal(prefillName) {
  modalShell(`
    <h2>Novo verbete</h2>
    <label>Nome (o termo, a palavra, a classe...)</label>
    <input type="text" id="newName" placeholder="Ex: Redis" value="${escapeHtml(prefillName || '')}" />
    <label>O que é isso? (em suas próprias palavras)</label>
    <textarea id="newDesc" placeholder="Ex: um jeito de guardar dados na memória pra acessar rapidinho depois."></textarea>
    <div id="newMsg" class="msg"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn-pill btn-primary" onclick="submitNewConcept()">Guardar</button>
    </div>
  `);
  document.getElementById('newName').focus();
}

async function submitNewConcept() {
  const name = document.getElementById('newName').value.trim();
  const description = document.getElementById('newDesc').value.trim();
  const msg = document.getElementById('newMsg');
  if (!name) { msg.textContent = 'Dá um nome pra essa ideia primeiro.'; msg.className = 'msg error'; return; }
  try {
    const created = await api('/api/concepts', { method: 'POST', body: JSON.stringify({ name, description }) });
    closeModal();
    state.allConceptsCache = null;
    await loadAllConcepts();
    openConceptDetail(created.id);
  } catch (e) {
    msg.textContent = e.status === 409 ? 'Você já guardou algo com esse nome.' : e.message;
    msg.className = 'msg error';
  }
}

async function openConceptDetail(id) {
  const c = await api('/api/concepts/' + id);
  state.view = { type: 'detail', id };
  renderNav(state.concepts);
  await renderConceptDetail(c);
}

async function renderConceptDetail(c) {
  const allConcepts = await ensureAllConceptsCache();
  const relatedIds = new Set(c.relations.map(r => r.conceptId));
  const pickable = allConcepts.filter(x => x.id !== c.id && !relatedIds.has(x.id));

  setMainContent(`
    <div class="main-header">
      <button class="icon-btn" onclick="renderFeed()">${svg('back')}</button>
      <h1>${escapeHtml(c.name)}</h1>
    </div>
    <div class="detail">
      <p class="desc">${escapeHtml(c.description || 'Sem descrição ainda.')}</p>
      ${c.tags.length ? `<div class="tag-row">${c.tags.map(t => `<span class="tag-pill">${escapeHtml(t.name)}</span>`).join('')}</div>` : ''}

      <div class="section">
        <div class="section-title">Relacionados · ${c.relations.length}</div>
        ${c.relations.map(r => `
          <div class="item relation-item" onclick="openConceptDetail('${r.conceptId}')">
            <div><div class="t">${escapeHtml(r.conceptName)}</div><div class="d">${escapeHtml(RELATION_LABELS[r.relationType] || r.relationType)}</div></div>
            <button class="item-remove" onclick="event.stopPropagation(); unlinkRelation('${c.id}','${r.conceptId}','${r.relationType}')">remover</button>
          </div>
        `).join('') || '<div class="item-empty">Nenhum ainda.</div>'}
        <div class="quick-add">
          <input class="field" list="allConceptsList" type="text" id="relationConceptName" placeholder="Nome de outro verbete" />
          <datalist id="allConceptsList">${pickable.map(x => `<option value="${escapeHtml(x.name)}">`).join('')}</datalist>
          <select class="field" id="relationType">
            <option value="RelatedTo">Relacionado a</option>
            <option value="AlternativeTo">Alternativa a</option>
          </select>
          <button class="btn" onclick="addRelation('${c.id}')">Relacionar</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Anotações · ${c.notes.length}</div>
        ${c.notes.map(n => `<div class="item"><div class="t">${escapeHtml(n.title)}</div><div class="d">${renderNoteContent(n.content)}</div></div>`).join('') || '<div class="item-empty">Nenhuma ainda.</div>'}
        <div class="quick-add">
          <input class="field" type="text" id="quickNoteTitle" placeholder="Título" />
          <input class="field" type="text" id="quickNoteContent" placeholder="O que você quer lembrar?" />
          <button class="btn" onclick="quickAddNote('${c.id}')">Anotar</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Usado nos projetos · ${c.projects.length}</div>
        ${c.projects.map(p => `<div class="item"><div class="t">${escapeHtml(p.name)}</div><div class="d">${escapeHtml(p.description || '')}</div></div>`).join('') || '<div class="item-empty">Nenhum ainda.</div>'}
      </div>

      <div id="detailMsg" class="msg"></div>
      <div class="detail-footer">
        <button class="btn btn-danger" onclick="deleteConcept('${c.id}')">Apagar este verbete</button>
      </div>
    </div>
  `);
}

async function addRelation(conceptId) {
  const nameInput = document.getElementById('relationConceptName');
  const name = nameInput.value.trim();
  const type = document.getElementById('relationType').value;
  const msg = document.getElementById('detailMsg');
  const allConcepts = await ensureAllConceptsCache();
  const target = allConcepts.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!target) { msg.textContent = 'Digite o nome de um verbete que já existe (aparece sugestão ao digitar).'; msg.className = 'msg error'; return; }
  try {
    await api(`/api/concepts/${conceptId}/relations/${target.id}`, { method: 'POST', body: JSON.stringify({ type }) });
    const c = await api('/api/concepts/' + conceptId);
    await renderConceptDetail(c);
  } catch (e) {
    msg.textContent = e.status === 409 ? 'Esses dois verbetes já estão relacionados assim.' : e.message;
    msg.className = 'msg error';
  }
}

async function unlinkRelation(conceptId, relatedConceptId, type) {
  await api(`/api/concepts/${conceptId}/relations/${relatedConceptId}?type=${type}`, { method: 'DELETE' });
  const c = await api('/api/concepts/' + conceptId);
  await renderConceptDetail(c);
}

async function quickAddNote(conceptId) {
  const title = document.getElementById('quickNoteTitle').value.trim();
  const content = document.getElementById('quickNoteContent').value.trim();
  const msg = document.getElementById('detailMsg');
  if (!title || !content) { msg.textContent = 'Preenche o título e o que você quer lembrar.'; msg.className = 'msg error'; return; }
  try {
    await api('/api/notes', { method: 'POST', body: JSON.stringify({ title, content, conceptIds: [conceptId] }) });
    const c = await api('/api/concepts/' + conceptId);
    await renderConceptDetail(c);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  }
}

async function deleteConcept(id) {
  if (!confirm('Tem certeza que quer apagar esse verbete? Isso não pode ser desfeito.')) return;
  await api('/api/concepts/' + id, { method: 'DELETE' });
  await loadAllConcepts();
  renderFeed();
}

async function loadStats() {
  const [notes, projects, tags] = await Promise.all([api('/api/notes'), api('/api/projects'), api('/api/tags')]);
  document.getElementById('statsLine').textContent =
    `${state.concepts.length} verbetes · ${notes.length} anotações · ${projects.length} projetos · ${tags.length} tags`;
}

loadTags();
loadAllConcepts().then(() => { renderFeed(); loadStats(); });
</script>
</body>
</html>
